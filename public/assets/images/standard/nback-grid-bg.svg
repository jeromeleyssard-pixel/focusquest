<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600">
  <defs>
    <linearGradient id="nb-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0a0a1a"/>
      <stop offset="50%"  stop-color="#0d1b3e"/>
      <stop offset="100%" stop-color="#060612"/>
    </linearGradient>
    <radialGradient id="nb-center-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#4f46e5" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nb-gem1" cx="35%" cy="30%" r="65%">
      <stop offset="0%"   stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </radialGradient>
    <radialGradient id="nb-gem2" cx="35%" cy="30%" r="65%">
      <stop offset="0%"   stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </radialGradient>
    <radialGradient id="nb-gem3" cx="35%" cy="30%" r="65%">
      <stop offset="0%"   stop-color="#86efac"/>
      <stop offset="100%" stop-color="#15803d"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="600" fill="url(#nb-bg)"/>

  <!-- Central ambient glow -->
  <ellipse cx="200" cy="300" rx="200" ry="250" fill="url(#nb-center-glow)"/>

  <!-- Stars -->
  <g fill="#fff">
    <circle cx="20"  cy="30"  r="1.0" opacity="0.7"/>
    <circle cx="60"  cy="15"  r="1.2" opacity="0.8"/>
    <circle cx="110" cy="40"  r="0.9" opacity="0.6"/>
    <circle cx="170" cy="20"  r="1.1" opacity="0.7"/>
    <circle cx="230" cy="35"  r="0.8" opacity="0.5"/>
    <circle cx="280" cy="12"  r="1.3" opacity="0.8"/>
    <circle cx="340" cy="45"  r="1.0" opacity="0.7"/>
    <circle cx="385" cy="25"  r="1.2" opacity="0.75"/>
    <circle cx="15"  cy="100" r="0.9" opacity="0.55"/>
    <circle cx="390" cy="120" r="1.0" opacity="0.6"/>
    <circle cx="10"  cy="500" r="1.1" opacity="0.6"/>
    <circle cx="392" cy="480" r="0.9" opacity="0.55"/>
    <circle cx="25"  cy="570" r="1.2" opacity="0.7"/>
    <circle cx="375" cy="565" r="1.0" opacity="0.65"/>
  </g>

  <!-- Neural network / memory grid lines -->
  <!-- Horizontal grid -->
  <g stroke="#4f46e5" stroke-opacity="0.20" stroke-width="0.8">
    <line x1="40"  y1="140" x2="360" y2="140"/>
    <line x1="40"  y1="200" x2="360" y2="200"/>
    <line x1="40"  y1="260" x2="360" y2="260"/>
    <line x1="40"  y1="320" x2="360" y2="320"/>
    <line x1="40"  y1="380" x2="360" y2="380"/>
    <line x1="40"  y1="440" x2="360" y2="440"/>
  </g>
  <!-- Vertical grid -->
  <g stroke="#4f46e5" stroke-opacity="0.20" stroke-width="0.8">
    <line x1="40"  y1="140" x2="40"  y2="440"/>
    <line x1="100" y1="140" x2="100" y2="440"/>
    <line x1="160" y1="140" x2="160" y2="440"/>
    <line x1="220" y1="140" x2="220" y2="440"/>
    <line x1="280" y1="140" x2="280" y2="440"/>
    <line x1="340" y1="140" x2="340" y2="440"/>
  </g>

  <!-- Grid node dots -->
  <g fill="#6366f1" opacity="0.45">
    <circle cx="40"  cy="140" r="3.5"/>
    <circle cx="100" cy="140" r="3.5"/>
    <circle cx="160" cy="140" r="3.5"/>
    <circle cx="220" cy="140" r="3.5"/>
    <circle cx="280" cy="140" r="3.5"/>
    <circle cx="340" cy="140" r="3.5"/>
    <circle cx="40"  cy="200" r="3.5"/>
    <circle cx="100" cy="200" r="3.5"/>
    <circle cx="160" cy="200" r="3.5"/>
    <circle cx="220" cy="200" r="3.5"/>
    <circle cx="280" cy="200" r="3.5"/>
    <circle cx="340" cy="200" r="3.5"/>
    <circle cx="40"  cy="260" r="3.5"/>
    <circle cx="100" cy="260" r="3.5"/>
    <circle cx="160" cy="260" r="3.5"/>
    <circle cx="220" cy="260" r="3.5"/>
    <circle cx="280" cy="260" r="3.5"/>
    <circle cx="340" cy="260" r="3.5"/>
    <circle cx="40"  cy="320" r="3.5"/>
    <circle cx="100" cy="320" r="3.5"/>
    <circle cx="160" cy="320" r="3.5"/>
    <circle cx="220" cy="320" r="3.5"/>
    <circle cx="280" cy="320" r="3.5"/>
    <circle cx="340" cy="320" r="3.5"/>
    <circle cx="40"  cy="380" r="3.5"/>
    <circle cx="100" cy="380" r="3.5"/>
    <circle cx="160" cy="380" r="3.5"/>
    <circle cx="220" cy="380" r="3.5"/>
    <circle cx="280" cy="380" r="3.5"/>
    <circle cx="340" cy="380" r="3.5"/>
    <circle cx="40"  cy="440" r="3.5"/>
    <circle cx="100" cy="440" r="3.5"/>
    <circle cx="160" cy="440" r="3.5"/>
    <circle cx="220" cy="440" r="3.5"/>
    <circle cx="280" cy="440" r="3.5"/>
    <circle cx="340" cy="440" r="3.5"/>
  </g>

  <!-- Highlighted / active nodes (brighter) -->
  <circle cx="100" cy="200" r="6" fill="#22d3ee" opacity="0.80"/>
  <circle cx="100" cy="200" r="12" fill="#22d3ee" opacity="0.18"/>
  <circle cx="280" cy="260" r="6" fill="#a78bfa" opacity="0.85"/>
  <circle cx="280" cy="260" r="12" fill="#a78bfa" opacity="0.20"/>
  <circle cx="160" cy="380" r="6" fill="#22d3ee" opacity="0.75"/>
  <circle cx="160" cy="380" r="10" fill="#22d3ee" opacity="0.15"/>
  <circle cx="340" cy="320" r="5" fill="#86efac" opacity="0.80"/>
  <circle cx="340" cy="320" r="10" fill="#86efac" opacity="0.18"/>

  <!-- Connection lines between highlighted nodes -->
  <line x1="100" y1="200" x2="280" y2="260" stroke="#a78bfa" stroke-width="1.5" opacity="0.35"/>
  <line x1="280" y1="260" x2="160" y2="380" stroke="#22d3ee" stroke-width="1.5" opacity="0.30"/>
  <line x1="160" y1="380" x2="340" y2="320" stroke="#86efac" stroke-width="1.2" opacity="0.28"/>

  <!-- Floating gems (decorative) -->
  <!-- Gem 1 (purple, top-left area) -->
  <polygon points="70,80 82,60 94,80 82,100" fill="url(#nb-gem1)" opacity="0.90"/>
  <polygon points="70,80 82,60 94,80"         fill="#c4b5fd"       opacity="0.40"/>
  <line x1="82" y1="60" x2="82" y2="100"     stroke="#e9d5ff"    stroke-width="0.8" opacity="0.50"/>

  <!-- Gem 2 (cyan, top-right) -->
  <polygon points="306,70 318,50 330,70 318,90" fill="url(#nb-gem2)" opacity="0.90"/>
  <polygon points="306,70 318,50 330,70"         fill="#a5f3fc"       opacity="0.40"/>
  <line x1="318" y1="50" x2="318" y2="90"       stroke="#cffafe"    stroke-width="0.8" opacity="0.50"/>

  <!-- Gem 3 (green, bottom-right) -->
  <polygon points="316,490 328,470 340,490 328,510" fill="url(#nb-gem3)" opacity="0.88"/>
  <polygon points="316,490 328,470 340,490"           fill="#bbf7d0"       opacity="0.40"/>
  <line x1="328" y1="470" x2="328" y2="510"          stroke="#d1fae5"    stroke-width="0.8" opacity="0.50"/>

  <!-- Gem 4 (purple, bottom-left) -->
  <polygon points="56,490 68,470 80,490 68,510" fill="url(#nb-gem1)" opacity="0.85"/>
  <polygon points="56,490 68,470 80,490"         fill="#c4b5fd"       opacity="0.38"/>

  <!-- Memory slot frames at top and bottom (hint at n-back concept) -->
  <rect x="30"  y="540" width="50" height="40" rx="6" fill="#1e1b4b" opacity="0.80"/>
  <rect x="92"  y="540" width="50" height="40" rx="6" fill="#1e1b4b" opacity="0.80"/>
  <rect x="154" y="540" width="50" height="40" rx="6" fill="#4f46e5" opacity="0.55"/>
  <rect x="216" y="540" width="50" height="40" rx="6" fill="#1e1b4b" opacity="0.80"/>
  <rect x="278" y="540" width="50" height="40" rx="6" fill="#1e1b4b" opacity="0.80"/>
  <rect x="340" y="540" width="30" height="40" rx="6" fill="#1e1b4b" opacity="0.80"/>
  <!-- Slot labels -->
  <text x="55"  y="565" font-family="monospace" font-size="14" fill="#6366f1" text-anchor="middle" opacity="0.70">N-3</text>
  <text x="117" y="565" font-family="monospace" font-size="14" fill="#6366f1" text-anchor="middle" opacity="0.70">N-2</text>
  <text x="179" y="565" font-family="monospace" font-size="14" fill="#e9d5ff" text-anchor="middle" opacity="0.95">N-1</text>
  <text x="241" y="565" font-family="monospace" font-size="14" fill="#6366f1" text-anchor="middle" opacity="0.70">N</text>
</svg>
