<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600">
  <defs>
    <linearGradient id="rd-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#87CEEB"/>
      <stop offset="60%"  stop-color="#B0DCF0"/>
      <stop offset="100%" stop-color="#D4ECFA"/>
    </linearGradient>
    <linearGradient id="rd-road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#4a4a5a"/>
      <stop offset="100%" stop-color="#2a2a3a"/>
    </linearGradient>
    <linearGradient id="rd-kerb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#9E9E9E"/>
      <stop offset="100%" stop-color="#757575"/>
    </linearGradient>
    <linearGradient id="rd-grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#66BB6A"/>
      <stop offset="100%" stop-color="#388E3C"/>
    </linearGradient>
    <linearGradient id="rd-building1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#90A4AE"/>
      <stop offset="100%" stop-color="#607D8B"/>
    </linearGradient>
    <linearGradient id="rd-building2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#BCAAA4"/>
      <stop offset="100%" stop-color="#8D6E63"/>
    </linearGradient>
    <linearGradient id="rd-pole" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#616161"/>
      <stop offset="100%" stop-color="#424242"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="400" height="600" fill="url(#rd-sky)"/>

  <!-- Clouds -->
  <ellipse cx="80"  cy="60"  rx="60" ry="24" fill="#fff" opacity="0.85"/>
  <ellipse cx="50"  cy="70"  rx="38" ry="20" fill="#fff" opacity="0.85"/>
  <ellipse cx="110" cy="70"  rx="42" ry="20" fill="#fff" opacity="0.85"/>
  <ellipse cx="290" cy="80"  rx="50" ry="20" fill="#fff" opacity="0.78"/>
  <ellipse cx="265" cy="90"  rx="32" ry="17" fill="#fff" opacity="0.78"/>
  <ellipse cx="318" cy="90"  rx="34" ry="17" fill="#fff" opacity="0.78"/>

  <!-- Sun -->
  <circle cx="340" cy="52" r="30" fill="#FFF9C4" opacity="0.90"/>
  <circle cx="340" cy="52" r="22" fill="#FFE082"/>

  <!-- Far buildings (horizon) -->
  <rect x="0"   y="190" width="55"  height="120" rx="2" fill="url(#rd-building1)" opacity="0.65"/>
  <rect x="10"  y="175" width="35"  height="145" rx="2" fill="url(#rd-building2)" opacity="0.60"/>
  <!-- Windows on buildings -->
  <g fill="#FFF9C4" opacity="0.55">
    <rect x="16" y="182" width="7" height="9" rx="1"/>
    <rect x="28" y="182" width="7" height="9" rx="1"/>
    <rect x="16" y="198" width="7" height="9" rx="1"/>
    <rect x="28" y="200" width="7" height="9" rx="1"/>
    <rect x="16" y="214" width="7" height="9" rx="1"/>
  </g>

  <rect x="330" y="185" width="70"  height="130" rx="2" fill="url(#rd-building1)" opacity="0.65"/>
  <rect x="348" y="170" width="40"  height="145" rx="2" fill="url(#rd-building2)" opacity="0.60"/>
  <g fill="#FFF9C4" opacity="0.55">
    <rect x="354" y="178" width="7" height="9" rx="1"/>
    <rect x="368" y="178" width="7" height="9" rx="1"/>
    <rect x="354" y="194" width="7" height="9" rx="1"/>
    <rect x="368" y="196" width="7" height="9" rx="1"/>
    <rect x="354" y="210" width="7" height="9" rx="1"/>
  </g>

  <!-- Trees alongside road -->
  <!-- Left trees -->
  <rect x="48"  y="285" width="10" height="60" rx="3" fill="#5D4037"/>
  <ellipse cx="53"  cy="278" rx="26" ry="34" fill="#388E3C"/>
  <ellipse cx="53"  cy="265" rx="20" ry="26" fill="#43A047"/>
  <rect x="108" y="310" width="10" height="50" rx="3" fill="#5D4037"/>
  <ellipse cx="113" cy="304" rx="22" ry="30" fill="#2E7D32"/>
  <ellipse cx="113" cy="292" rx="17" ry="22" fill="#388E3C"/>

  <!-- Right trees -->
  <rect x="342" y="285" width="10" height="60" rx="3" fill="#5D4037"/>
  <ellipse cx="347" cy="278" rx="26" ry="34" fill="#388E3C"/>
  <ellipse cx="347" cy="265" rx="20" ry="26" fill="#43A047"/>
  <rect x="282" y="310" width="10" height="50" rx="3" fill="#5D4037"/>
  <ellipse cx="287" cy="304" rx="22" ry="30" fill="#2E7D32"/>
  <ellipse cx="287" cy="292" rx="17" ry="22" fill="#388E3C"/>

  <!-- Pavement / kerb left -->
  <path d="M0,320 L140,240 L140,600 L0,600 Z" fill="url(#rd-grass)"/>
  <path d="M0,320 L140,240 L145,240 L5,325 Z"  fill="url(#rd-kerb)"/>
  <!-- Pavement / kerb right -->
  <path d="M400,320 L260,240 L260,600 L400,600 Z" fill="url(#rd-grass)"/>
  <path d="M400,320 L260,240 L255,240 L395,325 Z" fill="url(#rd-kerb)"/>

  <!-- Road surface (perspective trapezoid) -->
  <path d="M145,240 L255,240 L400,600 L0,600 Z" fill="url(#rd-road)"/>

  <!-- Road edge lines (white) -->
  <path d="M145,240 L0,600"   stroke="#E8E8E8" stroke-width="3" opacity="0.80"/>
  <path d="M255,240 L400,600" stroke="#E8E8E8" stroke-width="3" opacity="0.80"/>

  <!-- Centre dashed line (perspective) -->
  <line x1="200" y1="240" x2="170" y2="340" stroke="#FFE082" stroke-width="4" stroke-dasharray="18,14" opacity="0.90"/>
  <line x1="170" y1="340" x2="136" y2="460" stroke="#FFE082" stroke-width="5" stroke-dasharray="20,16" opacity="0.85"/>
  <line x1="136" y1="460" x2="96"  y2="600" stroke="#FFE082" stroke-width="6" stroke-dasharray="22,18" opacity="0.80"/>
  <!-- Mirror right side of centre line -->
  <line x1="200" y1="240" x2="230" y2="340" stroke="#FFE082" stroke-width="4" stroke-dasharray="18,14" opacity="0.90"/>
  <line x1="230" y1="340" x2="264" y2="460" stroke="#FFE082" stroke-width="5" stroke-dasharray="20,16" opacity="0.85"/>
  <line x1="264" y1="460" x2="304" y2="600" stroke="#FFE082" stroke-width="6" stroke-dasharray="22,18" opacity="0.80"/>

  <!-- Traffic light pole (left side, prominent) -->
  <rect x="124" y="230" width="8"  height="130" rx="3" fill="url(#rd-pole)"/>
  <!-- Traffic light box -->
  <rect x="90"  y="188" width="44" height="90"  rx="8" fill="#212121"/>
  <rect x="92"  y="190" width="40" height="86"  rx="6" fill="#1a1a1a"/>
  <!-- Red light (top) -->
  <circle cx="112" cy="208" r="13" fill="#880E4F" opacity="0.60"/>
  <circle cx="112" cy="208" r="10" fill="#F44336"/>
  <circle cx="109" cy="205" r="3"  fill="#FFCDD2" opacity="0.60"/>
  <!-- Amber (middle) -->
  <circle cx="112" cy="235" r="10" fill="#3E2723" opacity="0.80"/>
  <!-- Green light (bottom) -->
  <circle cx="112" cy="260" r="13" fill="#1B5E20" opacity="0.60"/>
  <circle cx="112" cy="260" r="10" fill="#4CAF50"/>
  <circle cx="109" cy="257" r="3"  fill="#C8E6C9" opacity="0.60"/>

  <!-- Road marking — zebra crossing near bottom -->
  <g fill="#E8E8E8" opacity="0.55">
    <rect x="20"  y="530" width="60" height="12" rx="2" transform="skewX(-12)"/>
    <rect x="90"  y="530" width="60" height="12" rx="2" transform="skewX(-12)"/>
    <rect x="160" y="530" width="60" height="12" rx="2" transform="skewX(-12)"/>
    <rect x="230" y="530" width="60" height="12" rx="2" transform="skewX(-12)"/>
    <rect x="300" y="530" width="60" height="12" rx="2" transform="skewX(-12)"/>
  </g>
</svg>
