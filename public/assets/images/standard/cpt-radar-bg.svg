<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600">
  <defs>
    <radialGradient id="cr-space" cx="50%" cy="50%" r="70%">
      <stop offset="0%"   stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#020810"/>
    </radialGradient>
    <radialGradient id="cr-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#00e676" stop-opacity="0.32"/>
      <stop offset="60%"  stop-color="#00bcd4" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0b1f2a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cr-planet" cx="35%" cy="35%" r="65%">
      <stop offset="0%"   stop-color="#4fc3f7"/>
      <stop offset="100%" stop-color="#01579b"/>
    </radialGradient>
  </defs>

  <!-- Deep space background -->
  <rect width="400" height="600" fill="url(#cr-space)"/>

  <!-- Stars — scattered -->
  <g fill="#fff">
    <circle cx="18"  cy="22"  r="1.2" opacity="0.8"/>
    <circle cx="52"  cy="45"  r="0.9" opacity="0.6"/>
    <circle cx="88"  cy="18"  r="1.4" opacity="0.9"/>
    <circle cx="134" cy="38"  r="0.8" opacity="0.5"/>
    <circle cx="160" cy="12"  r="1.1" opacity="0.7"/>
    <circle cx="210" cy="30"  r="1.5" opacity="0.9"/>
    <circle cx="258" cy="16"  r="0.9" opacity="0.6"/>
    <circle cx="302" cy="44"  r="1.2" opacity="0.8"/>
    <circle cx="348" cy="20"  r="1.0" opacity="0.7"/>
    <circle cx="382" cy="52"  r="1.3" opacity="0.8"/>
    <circle cx="30"  cy="100" r="0.9" opacity="0.5"/>
    <circle cx="72"  cy="130" r="1.1" opacity="0.7"/>
    <circle cx="112" cy="88"  r="0.8" opacity="0.5"/>
    <circle cx="340" cy="95"  r="1.2" opacity="0.8"/>
    <circle cx="375" cy="140" r="0.9" opacity="0.6"/>
    <circle cx="358" cy="70"  r="1.4" opacity="0.85"/>
    <circle cx="14"  cy="180" r="1.0" opacity="0.6"/>
    <circle cx="390" cy="200" r="1.1" opacity="0.7"/>
    <circle cx="22"  cy="290" r="0.9" opacity="0.5"/>
    <circle cx="388" cy="320" r="1.0" opacity="0.6"/>
    <circle cx="8"   cy="420" r="1.2" opacity="0.7"/>
    <circle cx="395" cy="450" r="0.8" opacity="0.5"/>
    <circle cx="28"  cy="530" r="1.1" opacity="0.6"/>
    <circle cx="378" cy="560" r="1.3" opacity="0.7"/>
  </g>

  <!-- Planet top-right -->
  <circle cx="340" cy="80" r="44" fill="url(#cr-planet)" opacity="0.85"/>
  <ellipse cx="340" cy="80" rx="56" ry="12" fill="none" stroke="#81d4fa" stroke-width="3" opacity="0.55"/>
  <!-- Planet surface details -->
  <ellipse cx="328" cy="68" rx="18" ry="8" fill="#0288d1" opacity="0.4" transform="rotate(-15 328 68)"/>
  <ellipse cx="352" cy="90" rx="12" ry="5" fill="#01579b" opacity="0.35" transform="rotate(10 352 90)"/>

  <!-- Radar screen (main) -->
  <circle cx="200" cy="300" r="170" fill="#071824" opacity="0.92"/>
  <circle cx="200" cy="300" r="170" fill="url(#cr-glow)"/>

  <!-- Radar grid circles -->
  <circle cx="200" cy="300" r="42"  fill="none" stroke="#00e676" stroke-width="1.2" opacity="0.50"/>
  <circle cx="200" cy="300" r="84"  fill="none" stroke="#00e676" stroke-width="1.0" opacity="0.40"/>
  <circle cx="200" cy="300" r="126" fill="none" stroke="#00e676" stroke-width="1.0" opacity="0.30"/>
  <circle cx="200" cy="300" r="168" fill="none" stroke="#00e676" stroke-width="0.8" opacity="0.22"/>

  <!-- Radar crosshairs -->
  <line x1="32"  y1="300" x2="368" y2="300" stroke="#00e676" stroke-width="0.9" opacity="0.28"/>
  <line x1="200" y1="132" x2="200" y2="468" stroke="#00e676" stroke-width="0.9" opacity="0.28"/>
  <!-- Diagonal lines -->
  <line x1="80"  y1="180" x2="320" y2="420" stroke="#00e676" stroke-width="0.6" opacity="0.18"/>
  <line x1="320" y1="180" x2="80"  y2="420" stroke="#00e676" stroke-width="0.6" opacity="0.18"/>

  <!-- Radar sweep arm -->
  <line x1="200" y1="300" x2="344" y2="198" stroke="#76ff03" stroke-width="3" opacity="0.80" stroke-linecap="round"/>
  <!-- Sweep trail (fading arc) -->
  <path d="M200,300 L344,198 A170,170 0 0,0 342,302" fill="#00e676" opacity="0.08"/>

  <!-- Radar blips -->
  <circle cx="260" cy="220" r="5"  fill="#76ff03" opacity="0.90"/>
  <circle cx="260" cy="220" r="10" fill="#76ff03" opacity="0.25"/>
  <circle cx="148" cy="350" r="4"  fill="#00e5ff" opacity="0.80"/>
  <circle cx="148" cy="350" r="8"  fill="#00e5ff" opacity="0.20"/>
  <circle cx="310" cy="340" r="3"  fill="#76ff03" opacity="0.70"/>

  <!-- Console bottom panel -->
  <rect x="0" y="490" width="400" height="110" rx="0" fill="#071418"/>
  <rect x="0" y="490" width="400" height="4"   fill="#00e676" opacity="0.60"/>

  <!-- Console buttons row 1 -->
  <rect x="24"  y="508" width="40" height="22" rx="5" fill="#0d3b2e"/>
  <rect x="26"  y="510" width="36" height="18" rx="4" fill="#00c853" opacity="0.70"/>
  <rect x="78"  y="508" width="40" height="22" rx="5" fill="#0d2b3b"/>
  <rect x="80"  y="510" width="36" height="18" rx="4" fill="#00b0ff" opacity="0.70"/>
  <rect x="132" y="508" width="40" height="22" rx="5" fill="#3b1a0d"/>
  <rect x="134" y="510" width="36" height="18" rx="4" fill="#ff6d00" opacity="0.70"/>

  <!-- Console display right -->
  <rect x="210" y="502" width="166" height="36" rx="6" fill="#0d2030"/>
  <rect x="214" y="506" width="158" height="28" rx="4" fill="#0a1628"/>
  <!-- Scanning text -->
  <text x="293" y="524" font-family="monospace" font-size="11" fill="#00e676" text-anchor="middle" opacity="0.90">SCAN ACTIF</text>
  <text x="293" y="537" font-family="monospace" font-size="9"  fill="#00acc1" text-anchor="middle" opacity="0.70">CIBLE: AX</text>

  <!-- Console buttons row 2 -->
  <rect x="24"  y="544" width="26" height="26" rx="13" fill="#1a0d3b"/>
  <circle cx="37"  cy="557" r="9"  fill="#7c4dff" opacity="0.80"/>
  <rect x="62"  y="544" width="26" height="26" rx="13" fill="#3b0d0d"/>
  <circle cx="75"  cy="557" r="9"  fill="#ff1744" opacity="0.80"/>
  <rect x="100" y="544" width="26" height="26" rx="13" fill="#0d3b0d"/>
  <circle cx="113" cy="557" r="9"  fill="#00e676" opacity="0.80"/>
  <rect x="138" y="544" width="26" height="26" rx="13" fill="#3b2d0d"/>
  <circle cx="151" cy="557" r="9"  fill="#ffd600" opacity="0.80"/>

  <!-- Vertical meters -->
  <rect x="224" y="544" width="12" height="44" rx="3" fill="#0d2030"/>
  <rect x="224" y="566" width="12" height="22" rx="2" fill="#00e676" opacity="0.75"/>
  <rect x="244" y="544" width="12" height="44" rx="3" fill="#0d2030"/>
  <rect x="244" y="552" width="12" height="36" rx="2" fill="#00b0ff" opacity="0.70"/>
  <rect x="264" y="544" width="12" height="44" rx="3" fill="#0d2030"/>
  <rect x="264" y="570" width="12" height="18" rx="2" fill="#ffd600" opacity="0.65"/>

  <!-- Radar screen bezel -->
  <circle cx="200" cy="300" r="172" fill="none" stroke="#1a3a4a" stroke-width="5"/>
  <circle cx="200" cy="300" r="174" fill="none" stroke="#00acc1" stroke-width="1.5" opacity="0.35"/>
</svg>
