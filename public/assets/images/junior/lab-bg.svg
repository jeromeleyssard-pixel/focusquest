<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600">
  <defs>
    <linearGradient id="lb-wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#E8EAF6"/>
      <stop offset="100%" stop-color="#C5CAE9"/>
    </linearGradient>
    <linearGradient id="lb-floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#90A4AE"/>
      <stop offset="100%" stop-color="#607D8B"/>
    </linearGradient>
    <linearGradient id="lb-shelf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#A1887F"/>
      <stop offset="100%" stop-color="#795548"/>
    </linearGradient>
    <linearGradient id="lb-bin-red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#EF5350"/>
      <stop offset="100%" stop-color="#C62828"/>
    </linearGradient>
    <linearGradient id="lb-bin-blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#42A5F5"/>
      <stop offset="100%" stop-color="#1565C0"/>
    </linearGradient>
  </defs>

  <!-- Wall -->
  <rect width="400" height="600" fill="url(#lb-wall)"/>

  <!-- Wall tiles grid (subtle) -->
  <g stroke="#B0BEC5" stroke-width="0.8" opacity="0.45">
    <line x1="0" y1="80"  x2="400" y2="80"/>
    <line x1="0" y1="160" x2="400" y2="160"/>
    <line x1="0" y1="240" x2="400" y2="240"/>
    <line x1="0" y1="320" x2="400" y2="320"/>
    <line x1="80"  y1="0" x2="80"  y2="400"/>
    <line x1="160" y1="0" x2="160" y2="400"/>
    <line x1="240" y1="0" x2="240" y2="400"/>
    <line x1="320" y1="0" x2="320" y2="400"/>
  </g>

  <!-- Ceiling lamp -->
  <rect x="170" y="0" width="60" height="10" rx="3" fill="#9E9E9E"/>
  <rect x="178" y="10" width="44" height="22" rx="4" fill="#FFFDE7" opacity="0.95"/>
  <ellipse cx="200" cy="32" rx="30" ry="12" fill="#FFFDE7" opacity="0.30"/>

  <!-- Top shelf -->
  <rect x="30" y="55" width="340" height="12" rx="4" fill="url(#lb-shelf)"/>

  <!-- Shelf items: test tubes and bottles -->
  <!-- Left side test tubes -->
  <rect x="44"  y="20" width="10" height="36" rx="4" fill="#EF9A9A"/>
  <rect x="44"  y="20" width="10" height="18" rx="0" fill="#EF5350" opacity="0.7"/>
  <rect x="60"  y="25" width="10" height="30" rx="4" fill="#80DEEA"/>
  <rect x="60"  y="25" width="10" height="15" rx="0" fill="#00ACC1" opacity="0.7"/>
  <rect x="76"  y="18" width="10" height="38" rx="4" fill="#A5D6A7"/>
  <rect x="76"  y="18" width="10" height="19" rx="0" fill="#43A047" opacity="0.7"/>
  <rect x="92"  y="22" width="10" height="34" rx="4" fill="#FFF59D"/>
  <rect x="92"  y="22" width="10" height="17" rx="0" fill="#F9A825" opacity="0.7"/>

  <!-- Right side test tubes -->
  <rect x="298" y="20" width="10" height="36" rx="4" fill="#CE93D8"/>
  <rect x="298" y="20" width="10" height="18" rx="0" fill="#8E24AA" opacity="0.7"/>
  <rect x="314" y="25" width="10" height="30" rx="4" fill="#FFCC80"/>
  <rect x="314" y="25" width="10" height="15" rx="0" fill="#EF6C00" opacity="0.7"/>
  <rect x="330" y="18" width="10" height="38" rx="4" fill="#B3E5FC"/>
  <rect x="330" y="18" width="10" height="19" rx="0" fill="#0288D1" opacity="0.7"/>
  <rect x="346" y="22" width="10" height="34" rx="4" fill="#F48FB1"/>
  <rect x="346" y="22" width="10" height="17" rx="0" fill="#D81B60" opacity="0.7"/>

  <!-- Middle shelf -->
  <rect x="30" y="170" width="340" height="10" rx="3" fill="url(#lb-shelf)"/>

  <!-- Middle shelf items: beakers, books -->
  <!-- Beaker left -->
  <path d="M55 130 L55 168 Q55 172 60 172 L86 172 Q91 172 91 168 L82 130 Z" fill="#E3F2FD" stroke="#90CAF9" stroke-width="1.5" opacity="0.9"/>
  <path d="M55 155 L91 155 L91 168 Q91 172 86 172 L60 172 Q55 172 55 168 Z" fill="#42A5F5" opacity="0.45"/>
  <!-- Beaker right -->
  <path d="M305 130 L305 168 Q305 172 310 172 L336 172 Q341 172 341 168 L332 130 Z" fill="#FCE4EC" stroke="#F48FB1" stroke-width="1.5" opacity="0.9"/>
  <path d="M305 155 L341 155 L341 168 Q341 172 336 172 L310 172 Q305 172 305 168 Z" fill="#E91E63" opacity="0.4"/>
  <!-- Books centre -->
  <rect x="148" y="136" width="18" height="34" rx="2" fill="#EF5350"/>
  <rect x="168" y="132" width="18" height="38" rx="2" fill="#42A5F5"/>
  <rect x="188" y="138" width="18" height="32" rx="2" fill="#66BB6A"/>
  <rect x="208" y="134" width="18" height="36" rx="2" fill="#FFA726"/>
  <rect x="228" y="140" width="18" height="30" rx="2" fill="#AB47BC"/>

  <!-- Blackboard / central display -->
  <rect x="80" y="190" width="240" height="150" rx="10" fill="#263238"/>
  <rect x="86" y="196" width="228" height="138" rx="7"  fill="#37474F"/>
  <!-- Blackboard content: colour/shape symbols (hints for DCCS) -->
  <!-- Star -->
  <text x="116" y="280" font-size="52" fill="#FDD835" text-anchor="middle" font-family="Arial">★</text>
  <!-- Circle -->
  <circle cx="200" cy="262" r="24" fill="none" stroke="#EF5350" stroke-width="5"/>
  <!-- Square hint -->
  <text x="284" y="280" font-size="52" fill="#42A5F5" text-anchor="middle" font-family="Arial">■</text>
  <!-- Chalk scribble lines -->
  <line x1="90"  y1="200" x2="110" y2="200" stroke="#90A4AE" stroke-width="1.5" opacity="0.4"/>
  <line x1="290" y1="200" x2="314" y2="200" stroke="#90A4AE" stroke-width="1.5" opacity="0.4"/>

  <!-- Sorting bins (bottom half — key visual for DCCS) -->
  <!-- Red bin left -->
  <rect x="30"  y="370" width="140" height="160" rx="12" fill="url(#lb-bin-red)"/>
  <rect x="36"  y="376" width="128" height="148" rx="9"  fill="#EF9A9A" opacity="0.25"/>
  <rect x="26"  y="362" width="148" height="20"  rx="8"  fill="#C62828"/>
  <!-- Red bin label -->
  <text x="100" y="455" font-size="28" fill="#fff" text-anchor="middle" font-family="Arial Bold" font-weight="900" opacity="0.95">★</text>
  <text x="100" y="488" font-size="14" fill="#FFCDD2" text-anchor="middle" font-family="Arial" font-weight="700">FORME</text>

  <!-- Blue bin right -->
  <rect x="230" y="370" width="140" height="160" rx="12" fill="url(#lb-bin-blue)"/>
  <rect x="236" y="376" width="128" height="148" rx="9"  fill="#BBDEFB" opacity="0.20"/>
  <rect x="226" y="362" width="148" height="20"  rx="8"  fill="#1565C0"/>
  <!-- Blue bin label -->
  <circle cx="300" cy="452" r="20" fill="none" stroke="#fff" stroke-width="4" opacity="0.95"/>
  <text x="300" y="490" font-size="14" fill="#BBDEFB" text-anchor="middle" font-family="Arial" font-weight="700">COULEUR</text>

  <!-- Floor -->
  <rect x="0" y="545" width="400" height="55" fill="url(#lb-floor)"/>
  <!-- Floor tiles -->
  <g stroke="#78909C" stroke-width="0.8" opacity="0.4">
    <line x1="0"   y1="545" x2="400" y2="545"/>
    <line x1="80"  y1="545" x2="80"  y2="600"/>
    <line x1="160" y1="545" x2="160" y2="600"/>
    <line x1="240" y1="545" x2="240" y2="600"/>
    <line x1="320" y1="545" x2="320" y2="600"/>
  </g>

  <!-- Star decorations on wall -->
  <text x="30"  y="350" font-size="20" fill="#FDD835" opacity="0.50" font-family="Arial">✦</text>
  <text x="360" y="340" font-size="16" fill="#B39DDB" opacity="0.50" font-family="Arial">✦</text>
  <text x="370" y="180" font-size="14" fill="#80DEEA" opacity="0.45" font-family="Arial">✦</text>
  <text x="18"  y="200" font-size="14" fill="#FFAB40" opacity="0.45" font-family="Arial">✦</text>
</svg>
