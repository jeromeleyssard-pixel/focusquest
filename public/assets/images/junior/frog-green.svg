<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <!-- Drop shadow -->
  <ellipse cx="80" cy="154" rx="46" ry="7" fill="rgba(0,0,0,0.18)"/>

  <!-- Body -->
  <ellipse cx="80" cy="106" rx="48" ry="38" fill="#4caf50"/>
  <!-- Belly highlight -->
  <ellipse cx="80" cy="112" rx="30" ry="24" fill="#a5d6a7"/>

  <!-- Head -->
  <circle cx="80" cy="72" r="38" fill="#4caf50"/>
  <!-- Head top shading -->
  <ellipse cx="80" cy="56" rx="28" ry="14" fill="#388e3c" opacity="0.3"/>

  <!-- Eye sockets (protruding bumps) -->
  <circle cx="57" cy="52" r="16" fill="#2e7d32"/>
  <circle cx="103" cy="52" r="16" fill="#2e7d32"/>

  <!-- Eye whites -->
  <circle cx="57" cy="51" r="13" fill="#fffde7"/>
  <circle cx="103" cy="51" r="13" fill="#fffde7"/>

  <!-- Iris — golden -->
  <circle cx="57" cy="52" r="8.5" fill="#c8a020"/>
  <circle cx="103" cy="52" r="8.5" fill="#c8a020"/>

  <!-- Pupils — vertical ellipse like a real frog -->
  <ellipse cx="58" cy="53" rx="4.5" ry="6.5" fill="#111"/>
  <ellipse cx="104" cy="53" rx="4.5" ry="6.5" fill="#111"/>

  <!-- Eye catchlight -->
  <circle cx="55" cy="48" r="3" fill="#fff" opacity="0.95"/>
  <circle cx="101" cy="48" r="3" fill="#fff" opacity="0.95"/>

  <!-- Nostrils -->
  <ellipse cx="73" cy="76" rx="3" ry="2" fill="#2e7d32"/>
  <ellipse cx="87" cy="76" rx="3" ry="2" fill="#2e7d32"/>

  <!-- BIG HAPPY SMILE — filled arc + white teeth -->
  <path d="M52 88 Q80 112 108 88" fill="#1b5e20"/>
  <path d="M52 88 Q80 110 108 88" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
  <!-- Smile outline -->
  <path d="M52 88 Q80 112 108 88" fill="none" stroke="#1b5e20" stroke-width="2"/>

  <!-- Left front leg -->
  <ellipse cx="36" cy="120" rx="14" ry="9" fill="#4caf50" transform="rotate(-22 36 120)"/>
  <ellipse cx="26" cy="130" rx="9" ry="6" fill="#388e3c" transform="rotate(-10 26 130)"/>
  <!-- Left toes — 3 round toes -->
  <circle cx="16" cy="134" r="5" fill="#4caf50"/>
  <circle cx="23" cy="139" r="5" fill="#4caf50"/>
  <circle cx="32" cy="141" r="5" fill="#4caf50"/>

  <!-- Right front leg -->
  <ellipse cx="124" cy="120" rx="14" ry="9" fill="#4caf50" transform="rotate(22 124 120)"/>
  <ellipse cx="134" cy="130" rx="9" ry="6" fill="#388e3c" transform="rotate(10 134 130)"/>
  <!-- Right toes -->
  <circle cx="144" cy="134" r="5" fill="#4caf50"/>
  <circle cx="137" cy="139" r="5" fill="#4caf50"/>
  <circle cx="128" cy="141" r="5" fill="#4caf50"/>

  <!-- Back feet (bottom) -->
  <ellipse cx="54" cy="144" rx="20" ry="9" fill="#388e3c" transform="rotate(-8 54 144)"/>
  <ellipse cx="106" cy="144" rx="20" ry="9" fill="#388e3c" transform="rotate(8 106 144)"/>
</svg>
