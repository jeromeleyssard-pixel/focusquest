<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600">
  <defs>
    <linearGradient id="pg-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5bbcdf"/>
      <stop offset="55%" stop-color="#a8ddf0"/>
      <stop offset="100%" stop-color="#cef0ff"/>
    </linearGradient>
    <linearGradient id="pg-water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e8aac"/>
      <stop offset="55%" stop-color="#0d6280"/>
      <stop offset="100%" stop-color="#094e68"/>
    </linearGradient>
    <linearGradient id="pg-bank" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a9e38"/>
      <stop offset="100%" stop-color="#3a6a20"/>
    </linearGradient>
    <radialGradient id="pg-sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff9c4"/>
      <stop offset="60%" stop-color="#ffe082"/>
      <stop offset="100%" stop-color="#ffe08200"/>
    </radialGradient>
  </defs>

  <!-- Sky -->
  <rect width="400" height="600" fill="url(#pg-sky)"/>

  <!-- Sun halo -->
  <circle cx="328" cy="72" r="52" fill="url(#pg-sun)" opacity="0.85"/>
  <!-- Sun core -->
  <circle cx="328" cy="72" r="24" fill="#fff9c4"/>

  <!-- Clouds -->
  <g opacity="0.88">
    <!-- Cloud 1 left -->
    <ellipse cx="78" cy="68" rx="52" ry="22" fill="#fff"/>
    <ellipse cx="50" cy="76" rx="32" ry="18" fill="#fff"/>
    <ellipse cx="106" cy="76" rx="36" ry="19" fill="#fff"/>
    <!-- Cloud 2 centre -->
    <ellipse cx="218" cy="88" rx="42" ry="17" fill="#fff" opacity="0.75"/>
    <ellipse cx="196" cy="96" rx="26" ry="14" fill="#fff" opacity="0.75"/>
    <ellipse cx="240" cy="96" rx="28" ry="15" fill="#fff" opacity="0.75"/>
  </g>

  <!-- Far tree line (silhouette) -->
  <!-- Left trees -->
  <ellipse cx="18"  cy="236" rx="38" ry="64" fill="#2a6628" opacity="0.75"/>
  <ellipse cx="56"  cy="224" rx="34" ry="72" fill="#357a32" opacity="0.82"/>
  <ellipse cx="90"  cy="238" rx="30" ry="58" fill="#2a6628" opacity="0.72"/>
  <ellipse cx="120" cy="248" rx="28" ry="52" fill="#3a8235" opacity="0.68"/>
  <!-- Right trees -->
  <ellipse cx="382" cy="234" rx="38" ry="66" fill="#2a6628" opacity="0.75"/>
  <ellipse cx="348" cy="226" rx="34" ry="70" fill="#357a32" opacity="0.80"/>
  <ellipse cx="316" cy="240" rx="30" ry="58" fill="#2a6628" opacity="0.72"/>
  <ellipse cx="288" cy="250" rx="26" ry="50" fill="#3a8235" opacity="0.68"/>

  <!-- Grassy bank -->
  <ellipse cx="200" cy="298" rx="240" ry="52" fill="url(#pg-bank)"/>

  <!-- Water body -->
  <rect x="0" y="285" width="400" height="315" fill="url(#pg-water)"/>

  <!-- Water surface shimmer -->
  <line x1="18"  y1="318" x2="110" y2="318" stroke="#5fd0ee" stroke-width="1.5" opacity="0.35"/>
  <line x1="155" y1="330" x2="270" y2="330" stroke="#5fd0ee" stroke-width="1"   opacity="0.28"/>
  <line x1="55"  y1="355" x2="168" y2="355" stroke="#5fd0ee" stroke-width="1.5" opacity="0.30"/>
  <line x1="240" y1="368" x2="382" y2="368" stroke="#5fd0ee" stroke-width="1"   opacity="0.25"/>
  <line x1="22"  y1="395" x2="145" y2="395" stroke="#5fd0ee" stroke-width="1"   opacity="0.22"/>
  <line x1="195" y1="410" x2="375" y2="410" stroke="#5fd0ee" stroke-width="1.5" opacity="0.28"/>

  <!-- Sun reflection on water -->
  <ellipse cx="328" cy="300" rx="22" ry="7"  fill="#fff9c4" opacity="0.22"/>
  <ellipse cx="328" cy="316" rx="14" ry="5"  fill="#fff9c4" opacity="0.14"/>

  <!-- ─── Lily pads ─── -->
  <!-- Pad left -->
  <ellipse cx="100" cy="348" rx="36" ry="20" fill="#2e7d32"/>
  <path d="M100 348 L100 328 L82 334 Z" fill="#1b5e20"/>
  <!-- Pink flower on left pad -->
  <circle cx="114" cy="340" r="8"  fill="#f48fb1" opacity="0.92"/>
  <circle cx="114" cy="340" r="5"  fill="#fff9c4"/>
  <circle cx="114" cy="340" r="2"  fill="#f9a825"/>

  <!-- Pad centre (main — character stands here) -->
  <ellipse cx="200" cy="362" rx="44" ry="24" fill="#338a38"/>
  <path d="M200 362 L200 338 L180 345 Z" fill="#2e7d32"/>
  <!-- Ripple around centre pad -->
  <ellipse cx="200" cy="366" rx="54" ry="12" fill="none" stroke="#5fd0ee" stroke-width="1.2" opacity="0.3"/>
  <ellipse cx="200" cy="370" rx="66" ry="15" fill="none" stroke="#5fd0ee" stroke-width="0.8" opacity="0.18"/>

  <!-- Pad right -->
  <ellipse cx="308" cy="338" rx="28" ry="16" fill="#2e7d32"/>
  <path d="M308 338 L308 322 L295 327 Z" fill="#1b5e20"/>
  <!-- Small bud on right pad -->
  <circle cx="318" cy="332" r="5" fill="#f48fb1" opacity="0.8"/>

  <!-- Small floating pad far left -->
  <ellipse cx="42"  cy="316" rx="18" ry="10" fill="#2e7d32" opacity="0.82"/>
  <path d="M42 316 L42 306 L34 309 Z" fill="#1b5e20"/>

  <!-- Small floating pad far right -->
  <ellipse cx="366" cy="326" rx="20" ry="11" fill="#2e7d32" opacity="0.80"/>
  <path d="M366 326 L366 315 L357 318 Z" fill="#1b5e20"/>

  <!-- ─── Cattails left ─── -->
  <line x1="28" y1="488" x2="28" y2="378" stroke="#5d4037" stroke-width="3.5"/>
  <ellipse cx="28" cy="384" rx="7" ry="20" fill="#6d4c41"/>
  <path d="M28 425 Q14 412 6 400" stroke="#558b2f" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <line x1="46" y1="490" x2="50" y2="398" stroke="#5d4037" stroke-width="2.5"/>
  <ellipse cx="50" cy="404" rx="5.5" ry="16" fill="#795548"/>
  <path d="M50 430 Q40 420 34 410" stroke="#558b2f" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- ─── Cattails right ─── -->
  <line x1="372" y1="485" x2="372" y2="376" stroke="#5d4037" stroke-width="3.5"/>
  <ellipse cx="372" cy="382" rx="7" ry="20" fill="#6d4c41"/>
  <path d="M372 420 Q386 408 394 396" stroke="#558b2f" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <line x1="356" y1="488" x2="352" y2="400" stroke="#5d4037" stroke-width="2.5"/>
  <ellipse cx="352" cy="406" rx="5.5" ry="16" fill="#795548"/>

  <!-- ─── Grass tufts on bank ─── -->
  <!-- Left -->
  <path d="M18 470 Q12 448 8 458" stroke="#558b2f" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M18 470 Q16 446 22 456" stroke="#558b2f" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M18 470 Q24 450 30 460" stroke="#558b2f" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M52 462 Q46 440 40 452"  stroke="#4caf50" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M52 462 Q54 438 58 450"  stroke="#4caf50" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Right -->
  <path d="M382 468 Q388 446 394 456" stroke="#558b2f" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M382 468 Q380 444 376 456" stroke="#558b2f" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M382 468 Q376 448 370 458" stroke="#558b2f" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M352 462 Q358 440 364 452" stroke="#4caf50" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M352 462 Q350 438 346 450" stroke="#4caf50" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- ─── Dragonfly ─── -->
  <ellipse cx="174" cy="298" rx="3.5" ry="14" fill="#00acc1"/>
  <circle  cx="174" cy="283" r="4.5"  fill="#00acc1"/>
  <circle  cx="173" cy="282" r="2"    fill="#b2ebf2"/>
  <circle  cx="175" cy="282" r="2"    fill="#b2ebf2"/>
  <ellipse cx="160" cy="291" rx="13" ry="4.5" fill="#b2ebf2" opacity="0.82" transform="rotate(-12 160 291)"/>
  <ellipse cx="188" cy="291" rx="13" ry="4.5" fill="#b2ebf2" opacity="0.82" transform="rotate(12 188 291)"/>
  <ellipse cx="162" cy="299" rx="10" ry="3.5" fill="#b2ebf2" opacity="0.70" transform="rotate(-8 162 299)"/>
  <ellipse cx="186" cy="299" rx="10" ry="3.5" fill="#b2ebf2" opacity="0.70" transform="rotate(8 186 299)"/>
</svg>
