<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Shadow -->
  <ellipse cx="60" cy="116" rx="36" ry="5" fill="rgba(0,0,0,0.18)"/>
  <!-- Body (square) -->
  <rect x="22" y="70" width="76" height="48" rx="8" fill="#78909C"/>
  <!-- Body panel -->
  <rect x="30" y="78" width="60" height="32" rx="5" fill="#546E7A"/>
  <!-- Panel lights -->
  <circle cx="44" cy="88" r="5" fill="#00BCD4"/>
  <circle cx="60" cy="88" r="5" fill="#69F0AE"/>
  <circle cx="76" cy="88" r="5" fill="#FF7043"/>
  <!-- Speaker grille -->
  <rect x="38" y="100" width="44" height="6" rx="3" fill="#37474F"/>
  <line x1="44" y1="100" x2="44" y2="106" stroke="#546E7A" stroke-width="1"/>
  <line x1="52" y1="100" x2="52" y2="106" stroke="#546E7A" stroke-width="1"/>
  <line x1="60" y1="100" x2="60" y2="106" stroke="#546E7A" stroke-width="1"/>
  <line x1="68" y1="100" x2="68" y2="106" stroke="#546E7A" stroke-width="1"/>
  <line x1="76" y1="100" x2="76" y2="106" stroke="#546E7A" stroke-width="1"/>
  <!-- Neck -->
  <rect x="50" y="60" width="20" height="13" rx="4" fill="#90A4AE"/>
  <!-- Head (square, rounded) -->
  <rect x="18" y="20" width="84" height="62" rx="12" fill="#90A4AE"/>
  <!-- Head panel -->
  <rect x="26" y="28" width="68" height="46" rx="7" fill="#546E7A"/>
  <!-- LED eyes -->
  <rect x="33" y="36" width="22" height="14" rx="5" fill="#00BCD4"/>
  <rect x="65" y="36" width="22" height="14" rx="5" fill="#00BCD4"/>
  <!-- Eye glow inner -->
  <rect x="35" y="38" width="18" height="10" rx="3" fill="#E0F7FA"/>
  <rect x="67" y="38" width="18" height="10" rx="3" fill="#E0F7FA"/>
  <!-- Mouth display -->
  <rect x="34" y="56" width="52" height="12" rx="4" fill="#37474F"/>
  <path d="M40 62 Q60 70 80 62" fill="none" stroke="#69F0AE" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Antenna -->
  <line x1="60" y1="20" x2="60" y2="6" stroke="#78909C" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="60" cy="5" r="5.5" fill="#F44336"/>
  <!-- Arms -->
  <rect x="6"  y="72" width="18" height="12" rx="4" fill="#78909C"/>
  <rect x="96" y="72" width="18" height="12" rx="4" fill="#78909C"/>
  <!-- Hands -->
  <rect x="3"  y="82" width="16" height="10" rx="3" fill="#90A4AE"/>
  <rect x="101" y="82" width="16" height="10" rx="3" fill="#90A4AE"/>
</svg>
